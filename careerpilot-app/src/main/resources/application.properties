spring.application.name=careerpilot
server.port=8081

# ---------- Database (override any value with an environment variable) ----------
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5434/careerpilot}
spring.datasource.username=${DB_USERNAME:careerpilot}
spring.datasource.password=${DB_PASSWORD:careerpilot}

# ---------- JPA / Hibernate ----------
# update = create/alter tables to match entities (fine for development; Phase 7 replaces it)
spring.jpa.hibernate.ddl-auto=update
# Keep database work inside services, not views
spring.jpa.open-in-view=false
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true

# ---------- Actuator ----------
management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=when-authorized

# ---------- CareerPilot settings (bound to AppProperties) ----------
careerpilot.name=CareerPilot 
careerpilot.tagline=Track every application, close your skill gaps and walk into interviews prepared.
careerpilot.time-zone=Africa/Nairobi
careerpilot.seed.enabled=true

# ---------- Security ----------
# Signs remember-me cookies. In production, set REMEMBER_ME_KEY to a long random secret.
careerpilot.security.remember-me-key=${REMEMBER_ME_KEY:dev-only-remember-me-key-change-me}


# ---------- Logging ----------
logging.level.com.careerpilot=DEBUG
logging.level.org.hibernate.SQL=DEBUG

server.servlet.session.timeout=60m
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.same-site=lax

<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">

<!-- Shared <head>. Usage: <head th:replace="~{fragments/layout :: head('Page title')}"></head> -->
<head th:fragment="head(title)">
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title th:text="${title} + ' · ' + ${app?.name ?: 'CareerPilot'}">CareerPilot</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
  <link rel="stylesheet" th:href="@{/css/app.css}">
</head>

<body>

<!-- Navbar. Usage: <nav th:replace="~{fragments/layout :: navbar('dashboard')}"></nav> -->
<nav th:fragment="navbar(active)" class="navbar navbar-expand-lg navbar-dark cp-navbar">
  <div class="container">
    <a class="navbar-brand fw-semibold" th:href="@{/}">
      <i class="bi bi-compass me-1"></i>
      <span th:text="${app?.name ?: 'CareerPilot'}">CareerPilot</span>
    </a>
    <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#mainNav"
            aria-controls="mainNav" aria-expanded="false" aria-label="Toggle navigation">
      <span class="navbar-toggler-icon"></span>
    </button>
    <div class="collapse navbar-collapse" id="mainNav">
            <!-- Logged in: app links + user menu -->
      <ul class="navbar-nav ms-auto align-items-lg-center" th:if="${currentUser != null}">
        <li class="nav-item">
          <a class="nav-link" th:href="@{/dashboard}" th:classappend="${active == 'dashboard'} ? 'active'">Dashboard</a>
        </li>
        <li class="nav-item">
          <a class="nav-link" th:href="@{/applications}" th:classappend="${active == 'applications'} ? 'active'">Applications</a>
        </li>
        <li class="nav-item dropdown">
          <a class="nav-link dropdown-toggle" href="#" role="button" data-bs-toggle="dropdown" aria-expanded="false">
            <i class="bi bi-person-circle me-1"></i><span th:text="${currentUser.firstName()}">Tracey</span>
          </a>
          <ul class="dropdown-menu dropdown-menu-end">
            <li>
              <span class="dropdown-item-text small">
                <span class="d-block fw-semibold" th:text="${currentUser.fullName()}">Tracey M</span>
                <span class="text-body-secondary" th:text="${currentUser.email()}">tracey@example.com</span>
              </span>
            </li>
            <li><hr class="dropdown-divider"></li>
            <li>
              <!-- Logout must be a POST with a CSRF token, so it's a form, not a link -->
              <form th:action="@{/logout}" method="post">
                <button type="submit" class="dropdown-item">
                  <i class="bi bi-box-arrow-right me-2"></i>Log out
                </button>
              </form>
            </li>
          </ul>
        </li>
      </ul>

      <!-- Logged out: auth buttons -->
      <div class="ms-auto d-flex gap-2 py-2 py-lg-0" th:unless="${currentUser != null}">
        <a class="btn btn-sm btn-outline-light" th:href="@{/login}">Log in</a>
        <a class="btn btn-sm btn-primary" th:href="@{/register}">Get started</a>
      </div>
    </div>
  </div>
</nav>

<!-- Footer. Usage: <footer th:replace="~{fragments/layout :: footer}"></footer> -->
<footer th:fragment="footer" class="cp-footer mt-auto py-4">
  <div class="container d-flex flex-column flex-md-row justify-content-between gap-2 small text-body-secondary">
    <span>
      &copy; <span th:text="${#dates.year(#dates.createNow())}">2026</span>
      <span th:text="${app?.name ?: 'CareerPilot'}">CareerPilot</span>
    </span>
    <span th:text="${app?.tagline}">Tagline</span>
  </div>
</footer>

<!-- Flash messages. Usage: <th:block th:replace="~{fragments/layout :: alerts}"></th:block> -->
<th:block th:fragment="alerts">
  <div class="alert alert-success alert-dismissible fade show" role="status" th:if="${successMessage != null}">
    <i class="bi bi-check-circle me-1"></i><span th:text="${successMessage}">Saved.</span>
    <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close"></button>
  </div>
  <div class="alert alert-danger alert-dismissible fade show" role="alert" th:if="${errorMessage != null}">
    <i class="bi bi-exclamation-triangle me-1"></i><span th:text="${errorMessage}">Something went wrong.</span>
    <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close"></button>
  </div>
</th:block>

<!-- Scripts. Usage: <th:block th:replace="~{fragments/layout :: scripts}"></th:block> -->
<th:block th:fragment="scripts">
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</th:block>

</body>
</html>

<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">

<!-- Shared <head>. Usage: <head th:replace="~{fragments/layout :: head('Page title')}"></head> -->
<head th:fragment="head(title)">
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title th:text="${title} + ' · ' + ${app?.name ?: 'CareerPilot'}">CareerPilot</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
  <link rel="stylesheet" th:href="@{/css/app.css}">
</head>

<body>

<!-- Navbar. Usage: <nav th:replace="~{fragments/layout :: navbar('dashboard')}"></nav> -->
<nav th:fragment="navbar(active)" class="navbar navbar-expand-lg navbar-dark cp-navbar">
  <div class="container">
    <a class="navbar-brand fw-semibold" th:href="@{/}">
      <i class="bi bi-compass me-1"></i>
      <span th:text="${app?.name ?: 'CareerPilot'}">CareerPilot</span>
    </a>
    <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#mainNav"
            aria-controls="mainNav" aria-expanded="false" aria-label="Toggle navigation">
      <span class="navbar-toggler-icon"></span>
    </button>
    <div class="collapse navbar-collapse" id="mainNav">
      <ul class="navbar-nav ms-auto">
        <li class="nav-item">
          <a class="nav-link" th:href="@{/}" th:classappend="${active == 'home'} ? 'active'">Home</a>
        </li>
        <li class="nav-item">
          <a class="nav-link" th:href="@{/dashboard}" th:classappend="${active == 'dashboard'} ? 'active'">Dashboard</a>
        </li>
        <li class="nav-item">
          <a class="nav-link" th:href="@{/applications}" th:classappend="${active == 'applications'} ? 'active'">Applications</a>
        </li>
      </ul>
    </div>
  </div>
</nav>

<!-- Footer. Usage: <footer th:replace="~{fragments/layout :: footer}"></footer> -->
<footer th:fragment="footer" class="cp-footer mt-auto py-4">
  <div class="container d-flex flex-column flex-md-row justify-content-between gap-2 small text-body-secondary">
    <span>
      &copy; <span th:text="${#dates.year(#dates.createNow())}">2026</span>
      <span th:text="${app?.name ?: 'CareerPilot'}">CareerPilot</span>
    </span>
    <span th:text="${app?.tagline}">Tagline</span>
  </div>
</footer>

<!-- Scripts. Usage: <th:block th:replace="~{fragments/layout :: scripts}"></th:block> -->
<th:block th:fragment="scripts">
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</th:block>

</body>
</html>

<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('Not found')}"></head>
<body class="d-flex flex-column min-vh-100">
<nav th:replace="~{fragments/layout :: navbar('')}"></nav>

<main class="flex-grow-1 d-flex align-items-center">
  <div class="container text-center py-5">
    <p class="display-1 fw-bold cp-error-code mb-0">404</p>
    <h1 class="h3 mb-3">We couldn't find that</h1>
    <p class="text-body-secondary mb-4" th:if="${!#strings.isEmpty(message)}" th:text="${message}">Message</p>
    <p class="text-body-secondary mb-4" th:if="${#strings.isEmpty(message)}">
      The link may be broken, or the page may have moved.
    </p>
    <a class="btn btn-primary" th:href="@{/}"><i class="bi bi-house me-1"></i>Back to home</a>
  </div>
</main>

<footer th:replace="~{fragments/layout :: footer}"></footer>
<th:block th:replace="~{fragments/layout :: scripts}"></th:block>
</body>
</html>

<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('Applications')}"></head>
<body class="d-flex flex-column min-vh-100">
<nav th:replace="~{fragments/layout :: navbar('applications')}"></nav>

<main class="flex-grow-1 py-4">
  <div class="container">

    <div class="d-flex flex-wrap justify-content-between align-items-center gap-2 mb-3">
      <h1 class="h3 mb-0">Applications</h1>
           <a class="btn btn-primary" th:href="@{/applications/new}">
        <i class="bi bi-plus-lg me-1"></i>Add application
      </a>
    </div>

        <th:block th:replace="~{fragments/layout :: alerts}"></th:block>

    <!-- Status filter chips -->
    <div class="d-flex flex-wrap gap-2 mb-4">
      <a class="btn btn-sm rounded-pill" th:href="@{/applications}"
         th:classappend="${selectedStatus == null} ? 'btn-dark' : 'btn-outline-secondary'">All</a>
      <a th:each="s : ${statuses}"
         class="btn btn-sm rounded-pill"
         th:href="@{/applications(status=${s})}"
         th:classappend="${s == selectedStatus} ? 'btn-dark' : 'btn-outline-secondary'"
         th:text="${s.label}">Saved</a>
    </div>

    <!-- Empty state -->
    <div class="card cp-card" th:if="${#lists.isEmpty(applications)}">
      <div class="card-body text-center py-5">
        <i class="bi bi-inbox fs-1 text-body-secondary"></i>
        <h2 class="h5 mt-3">No applications yet</h2>
                <div th:if="${selectedStatus == null}">
          <p class="text-body-secondary">Every job you track will appear here.</p>
          <a class="btn btn-primary" th:href="@{/applications/new}">
            <i class="bi bi-plus-lg me-1"></i>Add your first application
          </a>
        </div>
        <p class="text-body-secondary mb-0" th:unless="${selectedStatus == null}"
           th:text="'Nothing with status ' + ${selectedStatus.label} + ' yet.'">Nothing yet.</p>
      </div>
    </div>

    <!-- Table -->
    <div class="card cp-card" th:unless="${#lists.isEmpty(applications)}">
      <div class="table-responsive">
        <table class="table table-hover align-middle mb-0 cp-table">
          <thead class="table-light">
          <tr>
            <th scope="col">Company</th>
            <th scope="col">Role</th>
            <th scope="col" class="d-none d-md-table-cell">Location</th>
            <th scope="col">Status</th>
            <th scope="col" class="d-none d-md-table-cell">Applied</th>
            <th scope="col" class="d-none d-lg-table-cell">Interview</th>
            <th scope="col"><span class="visually-hidden">Actions</span></th>
          </tr>
          </thead>
          <tbody>
          <tr th:each="a : ${applications}">
            <td class="fw-semibold" th:text="${a.companyName()}">Company</td>
            <td th:text="${a.jobTitle()}">Role</td>
            <td class="d-none d-md-table-cell" th:text="${a.location() ?: '—'}">Nairobi</td>
            <td>
              <span class="badge rounded-pill cp-status"
                    th:classappend="'cp-status-' + ${#strings.toLowerCase(a.status().name())}"
                    th:text="${a.status().label}">Applied</span>
            </td>
            <td class="d-none d-md-table-cell"
                th:text="${a.applicationDate() != null} ? ${#temporals.format(a.applicationDate(), 'd MMM yyyy')} : '—'">
              2 Nov 2026
            </td>
            <td class="d-none d-lg-table-cell"
                th:text="${a.interviewDate() != null} ? ${#temporals.format(a.interviewDate(), 'd MMM yyyy')} : '—'">
              —
            </td>
            <td class="text-end">
              <a class="btn btn-sm btn-outline-secondary" th:href="@{/applications/{id}(id=${a.id()})}">View</a>
            </td>
          </tr>
          </tbody>
        </table>
      </div>
    </div>

  </div>
</main>

<footer th:replace="~{fragments/layout :: footer}"></footer>
<th:block th:replace="~{fragments/layout :: scripts}"></th:block>
</body>
</html>

services:
  postgres:
    image: postgres:17-alpine
    container_name: careerpilot-db
    environment:
      POSTGRES_DB: careerpilot
      POSTGRES_USER: careerpilot
      POSTGRES_PASSWORD: careerpilot
    ports:
      - "5434:5432"            # host:container (5434 avoids clashing with a local Homebrew Postgres)
    volumes:
      - careerpilot-data:/var/lib/postgresql/data   # data survives container restarts
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U careerpilot -d careerpilot"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

volumes:
  careerpilot-data: